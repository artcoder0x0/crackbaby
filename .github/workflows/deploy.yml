name: Build & Deploy

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: crackbaby
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/m365/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            IMAGE_NAME="crackbaby"
            IMAGE_TAG="${{ github.sha }}"
            export IMAGE="$DOCKERHUB_USERNAME/$IMAGE_NAME:$IMAGE_TAG"

            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            # Pull new image first
            docker pull $IMAGE

            # ── ALWAYS force remove old containers ──────────────────────────
            docker rm -f admin-srv device-srv refresh-srv rules-daemon 2>/dev/null || true

            # Also tear down any compose-managed leftovers
            cd /home/ubuntu/m365
            docker compose down --remove-orphans --timeout 10 2>/dev/null || true

            # Ensure data dir with correct ownership
            mkdir -p /home/ubuntu/m365/data
            sudo chown -R 1001:1001 /home/ubuntu/m365/data

            # ── Deploy fresh ────────────────────────────────────────────────
            IMAGE=$IMAGE docker compose up -d

            # Wait a moment then verify all 4 are running
            sleep 3
            docker compose ps

            echo "✅ Checking all services are Up..."
            docker compose ps | grep -E "admin-srv|device-srv|refresh-srv|rules-daemon" | grep -v "Up" && echo "❌ Some services failed!" && exit 1 || echo "✅ All services running"

            # ── Cleanup old images ──────────────────────────────────────────
            docker images "$DOCKERHUB_USERNAME/$IMAGE_NAME" --format "{{.ID}} {{.Tag}}" | \
              grep -v "$IMAGE_TAG" | grep -v "latest" | \
              awk '{print $1}' | xargs -r docker rmi 2>/dev/null || true

            echo "🚀 Deploy complete: $IMAGE"