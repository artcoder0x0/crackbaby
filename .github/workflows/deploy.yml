name: Build & Deploy crackbaby  

on:  
  push:
    branches: [main]

env:
  IMAGE_NAME: crackbaby
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            IMAGE_NAME="crackbaby"
            IMAGE_TAG="${{ github.sha }}"
            IMAGE="$DOCKERHUB_USERNAME/$IMAGE_NAME:$IMAGE_TAG"

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker pull $IMAGE

            docker stop admin-srv device-srv refresh-srv 2>/dev/null || true
            docker rm   admin-srv device-srv refresh-srv 2>/dev/null || true

            docker network create m365net 2>/dev/null || true

            # Persist the SQLite DB between deploys
            mkdir -p /home/ubuntu/m365
            touch /home/ubuntu/m365/admin.db
            chmod 666 /home/ubuntu/m365/admin.db

            # Admin server
            docker run -d \
              --name admin-srv \
              --network m365net \
              --restart unless-stopped \
              -p 127.0.0.1:3738:3738 \
              -v /home/ubuntu/m365/admin.db:/app/admin.db \
              -e REFRESHER_URL=http://refresh-srv:3737/refresh \
              $IMAGE \
              node admin-server.js

            # Device code server
            docker run -d \
              --name device-srv \
              --network m365net \
              --restart unless-stopped \
              -p 127.0.0.1:3210:3210 \
              $IMAGE \
              node deviceserver2.js

            # Token refresher
            docker run -d \
              --name refresh-srv \
              --network m365net \
              --restart unless-stopped \
              -p 127.0.0.1:3737:3737 \
              $IMAGE \
              node token-refresher.js

            docker image prune -f
